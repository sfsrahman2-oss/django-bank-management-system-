{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h2 class="fw-bold mb-2">Create Bank Account</h2>

                <p class="text-muted mb-4">
                    Create your bank account to start using the banking system.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-primary w-100">
                        Create Bank Account
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'dashboard' %}"
                       class="text-decoration-none">
                        ← Back to Dashboard
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
